# Project-scoped Codex MCP configuration for the local KiCad Compose service.
# Set KICAD_MCP_AUTH_TOKEN to the same value used by Compose before starting Codex.

mcp_optional_startup_grace_ms = 0

[mcp_servers.kicad]
url = "http://127.0.0.1:3334/mcp"
bearer_token_env_var = "KICAD_MCP_AUTH_TOKEN"
required = true
startup_timeout_sec = 60
tool_timeout_sec = 120
default_tools_approval_mode = "writes"
enabled_tools = [
  "kicad_get_server_info",
  "kicad_get_project_info",
  "kicad_get_version",
  "kicad_health",
  "kicad_doctor",
  "kicad_create_new_project",
  "kicad_set_project",
  "pcb_get_board_summary",
  "pcb_get_footprints",
  "pcb_get_nets",
  "pcb_get_tracks",
  "pcb_get_shapes",
  "pcb_move_component",
  "pcb_move_footprint",
  "pcb_route_trace",
  "pcb_save",
]

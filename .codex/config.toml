# Project-scoped Codex MCP configuration for the local KiCad Compose service.
# The static token matches Compose's non-secret, loopback-only development default.

mcp_optional_startup_grace_ms = 1000

[mcp_servers.kicad]
url = "http://127.0.0.1:3334/mcp"
http_headers = { Authorization = "Bearer kicad-automation-local-dev-token-change-me-2026" }
required = false
startup_timeout_sec = 60
tool_timeout_sec = 120
default_tools_approval_mode = "writes"
enabled_tools = [
  "kicad_get_server_info",
  "kicad_get_project_info",
  "kicad_get_version",
  "kicad_health",
  "kicad_doctor",
  "kicad_create_new_project",
  "kicad_set_project",
  "pcb_get_board_summary",
  "pcb_get_footprints",
  "pcb_get_nets",
  "pcb_get_tracks",
  "pcb_get_shapes",
  "pcb_move_component",
  "pcb_move_footprint",
  "pcb_route_trace",
  "pcb_save",
  "sch_get_symbols",
  "sch_get_wires",
  "sch_get_labels",
  "sch_get_net_names",
  "sch_get_population_status",
  "sch_list_sheets",
  "sch_get_sheet_info",
  "sch_list_sheet_pins",
  "sch_get_pin_positions",
  "sch_check_power_flags",
]
